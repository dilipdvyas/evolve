<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Diwali greeting illustration</title>
  <desc id="desc">A festive Diwali-style illustration with glowing diyas, rangoli-inspired circles, and warm golden light.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="45%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9db" stop-opacity="0.98"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lampBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" rx="64" fill="url(#bgGlow)"/>
  <circle cx="400" cy="400" r="260" fill="none" stroke="#fde68a" stroke-width="10" stroke-opacity="0.55"/>
  <circle cx="400" cy="400" r="220" fill="none" stroke="#fdba74" stroke-width="6" stroke-dasharray="8 14" stroke-opacity="0.7"/>
  <circle cx="400" cy="400" r="180" fill="none" stroke="#fff7d6" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round" stroke-opacity="0.9"/>

  <g opacity="0.6">
    <circle cx="220" cy="200" r="14" fill="#fff7d6"/>
    <circle cx="580" cy="180" r="10" fill="#fff7d6"/>
    <circle cx="620" cy="260" r="8" fill="#fde68a"/>
    <circle cx="180" cy="590" r="11" fill="#fde68a"/>
    <circle cx="575" cy="610" r="12" fill="#fff7d6"/>
  </g>

  <g transform="translate(400 455)">
    <ellipse cx="0" cy="42" rx="188" ry="54" fill="#7c2d12" fill-opacity="0.12"/>

    <g transform="translate(-220 55) scale(0.86)">
      <circle cx="0" cy="-40" r="78" fill="url(#lampGlow)"/>
      <path d="M -64 16 C -38 -28, 38 -28, 64 16 C 42 42, -42 42, -64 16 Z" fill="url(#lampBody)"/>
      <path d="M 0 -96 C 28 -72, 32 -24, 0 4 C -32 -24, -28 -72, 0 -96 Z" fill="url(#flame)"/>
    </g>

    <g>
      <circle cx="0" cy="-52" r="124" fill="url(#lampGlow)"/>
      <path d="M -108 34 C -70 -34, 70 -34, 108 34 C 70 78, -70 78, -108 34 Z" fill="url(#lampBody)"/>
      <path d="M 0 -148 C 42 -110, 48 -38, 0 10 C -48 -38, -42 -110, 0 -148 Z" fill="url(#flame)"/>
      <path d="M -86 22 C -44 42, 44 42, 86 22" fill="none" stroke="#fed7aa" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    </g>

    <g transform="translate(220 55) scale(0.86)">
      <circle cx="0" cy="-40" r="78" fill="url(#lampGlow)"/>
      <path d="M -64 16 C -38 -28, 38 -28, 64 16 C 42 42, -42 42, -64 16 Z" fill="url(#lampBody)"/>
      <path d="M 0 -96 C 28 -72, 32 -24, 0 4 C -32 -24, -28 -72, 0 -96 Z" fill="url(#flame)"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <path d="M 214 392 C 262 332, 332 302, 400 302 C 468 302, 538 332, 586 392" stroke="#fff7d6" stroke-width="5"/>
    <path d="M 252 430 C 292 384, 344 362, 400 362 C 456 362, 508 384, 548 430" stroke="#fde68a" stroke-width="4" stroke-dasharray="2 12"/>
  </g>
</svg>